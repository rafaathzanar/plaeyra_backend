spring.datasource.url=jdbc:mysql://localhost:3306/play
spring.datasource.username=root
spring.datasource.password=19444
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Stripe Configuration
stripe.secret-key=sk_test_your_stripe_secret_key_here
stripe.publishable-key=pk_test_your_stripe_publishable_key_here
stripe.webhook-secret=whsec_your_webhook_secret_here

# Firebase Configuration
firebase.project-id=your-firebase-project-id
firebase.private-key-id=your-private-key-id
firebase.private-key=your-private-key
firebase.client-email=your-client-email
firebase.client-id=your-client-id

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Configuration
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
app.mobile-app-url=exp://localhost:19000

# JWT Configuration
jwt.secret=your-jwt-secret-key-here-make-it-long-and-secure
jwt.expiration=86400000

# Dynamic Pricing Configuration
pricing.peak-hour-multiplier=1.5
pricing.off-peak-multiplier=0.8
pricing.weekend-multiplier=1.2
pricing.holiday-multiplier=1.3

# Loyalty Program Configuration
loyalty.points-per-booking=100
loyalty.points-per-currency=10
loyalty.bronze-threshold=0
loyalty.silver-threshold=1000
loyalty.gold-threshold=5000
loyalty.platinum-threshold=10000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-request-headers=true
springdoc.swagger-ui.show-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.request-interceptor=com.zanar.playera.config.SwaggerRequestInterceptor
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=com.zanar.playera.controller
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.oauth2-redirect-url=/swagger-ui/oauth2-redirect.html

# Additional Swagger UI Enhancements
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.syntax-highlight.theme=monokai
springdoc.swagger-ui.layout=BaseLayout
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.use-bearer=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# API Documentation Metadata
springdoc.api-docs.version=1.0.0
springdoc.api-docs.title=PlayEra API Documentation
springdoc.api-docs.description=Comprehensive API for the PlayEra sports venue booking platform
springdoc.api-docs.contact.name=PlayEra Development Team
springdoc.api-docs.contact.email=dev@playera.com
springdoc.api-docs.contact.url=https://playera.com
springdoc.api-docs.license.name=MIT License
springdoc.api-docs.license.url=https://opensource.org/licenses/MIT